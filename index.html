<script>
function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(tabName + '-tab').classList.add('active');
}

const tutorialSteps = [
  {
    title: '¿Qué es una variable?',
    content: `
      <p>Una <strong>variable</strong> es como una caja donde guardas información.</p>
      <p>En Python:</p>
      <div class="tutorial-code">edad = 25</div>
      <p>En Java:</p>
      <div class="tutorial-code">int edad = 25;</div>
      <p>En C++:</p>
      <div class="tutorial-code">int edad = 25;</div>
    `
  },
  {
    title: 'Suma: Juntar cantidades',
    content: `

a = 5<br>
b = 3<br>
suma = a + b<br>
print(suma)
      </div>
    `
  },

    title: 'Resta: Quitar cantidades',
    content: `
      <p>La <strong>resta</strong> usa el símbolo <code>-</code>.</p>
      <div class="tutorial-code">
# Python<br>
total = 10<br>

  {

    content: `
      <p>Puedes combinar varias operaciones:</p>
      <div class="tutorial-code">
resultado = 10 + 5 - 3<br>
print(resultado)
      </div>
    `
  },
  {
    title: 'Imprimir resultados',
    content: `
      <p><strong>Python:</strong> print("Hola")</p>
      <p><strong>Java:</strong> System.out.println("Hola");</p>
      <p><strong>C++:</strong> cout << "Hola" << endl;</p>
    `
  }
];

let currentStep = 0;

function renderTutorial() {
  const content = document.getElementById('tutorial-content');
  const step = tutorialSteps[currentStep];
  content.innerHTML = `
    <div class="tutorial-step">
      <h3>Paso ${currentStep + 1}: ${step.title}</h3>
      ${step.content}
    </div>
  `;
  document.getElementById('prev-btn').disabled = currentStep === 0;
  document.getElementById('next-btn').disabled = currentStep === tutorialSteps.length - 1;
}

function nextStep() {
  if (currentStep < tutorialSteps.length - 1) {
    currentStep++;
    renderTutorial();
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderTutorial();
  }
}

renderTutorial();

let completedMissions = new Set();
let currentMission = null;

function renderMissions() {
  const container = document.getElementById('missions-content');
  container.innerHTML = '';
  
  Object.values(missions).forEach(level => {
    const levelDiv = document.createElement('div');
    levelDiv.className = 'mission-level';
    levelDiv.innerHTML = `<h2>${level.title}</h2>`;
    
    const grid = document.createElement('div');
    grid.className = 'mission-grid';
    
    level.missions.forEach(mission => {
      const card = document.createElement('div');
      card.className = 'mission-card' + (completedMissions.has(mission.id) ? ' completed' : '');
      card.innerHTML = `
        <h4>
          ${completedMissions.has(mission.id) ? '✅' : '📝'} ${mission.title}
        </h4>
        <p>${mission.description}</p>
        <div class="mission-stars">
          <span class="star ${completedMissions.has(mission.id) ? 'earned' : ''}">⭐</span>
        </div>
      `;
      card.onclick = () => openMission(mission);
      grid.appendChild(card);
    });
    
    levelDiv.appendChild(grid);
    container.appendChild(levelDiv);
  });
  
  updateProgress();
}

function updateProgress() {
  const total = Object.values(missions).reduce((sum, level) => sum + level.missions.length, 0);
  const completed = completedMissions.size;
  const percent = Math.round((completed / total) * 100);
  const fill = document.getElementById('progress-fill');
  fill.style.width = percent + '%';
  fill.textContent = `${completed}/${total} (${percent}%)`;
}

function openMission(mission) {
  currentMission = mission;
  const lang = document.getElementById('lang').value;
  
  document.getElementById('modal-title').textContent = mission.title;
  document.getElementById('modal-objective').innerHTML = `
    <strong>Objetivo:</strong><br>${mission.objective}
  `;
  document.getElementById('mission-code').value = mission.starterCode[lang];
  document.getElementById('mission-output').innerHTML = '';
  document.getElementById('modal-hint').style.display = 'none';
  document.getElementById('mission-modal').classList.add('active');
}

function closeMission() {
  document.getElementById('mission-modal').classList.remove('active');
  currentMission = null;
}

function showHint() {
  const hint = document.getElementById('modal-hint');
  hint.textContent = '💡 ' + currentMission.hint;
  hint.style.display = 'block';
}

function checkMission() {
  const code = document.getElementById('mission-code').value;
  const lang = document.getElementById('lang').value;
  const outputEl = document.getElementById('mission-output');
  outputEl.innerHTML = '';
  
  try {
    let output = '';
    
    const originalPrint = window.print;
    window.print = function(msg, cls='') {
      output += msg + '\n';
    };
    
    if (lang === 'python') runPython(code);
    else if (lang === 'java') runJava(code);
    else if (lang === 'cpp') runCpp(code);
    
    window.print = originalPrint;
    
    outputEl.innerHTML = `<div style="color:#a6e3a1;">${output}</div>`;
    
    if (currentMission.validate(output)) {
      completedMissions.add(currentMission.id);
      outputEl.innerHTML += `<div class="success" style="margin-top:10px;">✅ ¡Misión completada!</div>`;
      renderMissions();
      setTimeout(closeMission, 2000);
    } else {
      outputEl.innerHTML += `<div class="err" style="margin-top:10px;">❌ No cumple el objetivo. Revisa tu código.</div>`;
    }
  } catch (e) {
    outputEl.innerHTML = `<div class="err">Error: ${e.message}</div>`;
  }
}

function tokenize(expr){
  const tokens=[];
  let i=0;
  while(i<expr.length){
    const c=expr[i];
    if(c===' '||c==='\t'){ i++; continue; }
    if(/[0-9.]/.test(c)){
      let n='';
      while(i<expr.length && /[0-9.]/.test(expr[i])) n+=expr[i++];
      tokens.push({type:'num', value:parseFloat(n)});
      continue;
    }
    if(/[a-zA-Z_]/.test(c)){
      let id='';
      while(i<expr.length && /[a-zA-Z0-9_]/.test(expr[i])) id+=expr[i++];
      tokens.push({type:'id', value:id});
      continue;
    }
    if(c==='"' || c==="'"){
      const q=c; let s=''; i++;
      while(i<expr.length && expr[i]!==q){ s+=expr[i++]; }
      i++;
      tokens.push({type:'str', value:s});
      continue;
    }
    if('+-*/()[]{}.,'.includes(c)){
      tokens.push({type:'op', value:c}); i++; continue;
    }
    throw new Error('Carácter inesperado: '+c);
  }
  return tokens;
}

    p=np;

        left = String(left)+String(right);
      else left = left+right;
    } else left = left-right;

  return [left, p];
}
function parseMulDiv(tokens, pos, env){
  let [left, p] = parseUnary(tokens, pos, env);
  while(p<tokens.length && tokens[p].type==='op' && '*/'.includes(tokens[p].value)){
    const op=tokens[p].value; p++;
    let [right, np] = parseUnary(tokens, p, env);
    p=np;
    if(op==='*') left=left*right;
    else {

      left=left/right;
    }

  return [left, p];
}
function parseUnary(tokens, pos, env){
  if(pos<tokens.length && tokens[pos].type==='op' && tokens[pos].value==='-'){
    let [v,p]=parsePrimary(tokens,pos+1,env);
    return [-v,p];
  }
  return parsePrimary(tokens,pos,env);
}
function parsePrimary(tokens, pos, env){

  let value, p=pos+1;
  if(t.type==='num') value=t.value;
  else if(t.type==='str') value=t.value;
  else if(t.type==='id'){
    if(!(t.value in env.vars)) throw new Error('Variable no definida: '+t.value);
    value = env.vars[t.value];

        throw new Error('Falta ]');
      p=np+1;
      if(Array.isArray(value)) value=value[idx];
      else if(value && typeof value==='object') value=value[idx];
      else throw new Error('No es indexable');
    }
  }

    let [v, np] = parseExpr(tokens, pos+1, env);
    if(tokens[np].type!=='op' || tokens[np].value!==')')
      throw new Error('Falta )');
    value=v; p=np+1;
  }
  else throw new Error('Token inesperado: '+t.value);
  return [value, p];
}
